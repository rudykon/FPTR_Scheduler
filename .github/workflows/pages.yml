name: Deploy project website

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "space/**"
      - "tools/build_pages.py"
      - "tools/build_web_figure_fallbacks.py"
      - "experiments/plot_paper_results.py"
      - "tests/test_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate demo inputs and browser runtime
        run: |
          node --check docs/assets/site.js
          node --check space/app.js
          node --check space/runtime.js
          python3 -m py_compile tools/build_pages.py experiments/plot_paper_results.py
          python3 tools/build_web_figure_fallbacks.py --check
          python3 -m unittest discover -s tests -p 'test_pages.py' -v
          python3 -m unittest discover -s space/tests -p 'test_*.py'
          node space/tests/test_runtime.js

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1
          actions-cache-folder: emsdk-cache

      - name: Build and smoke-test the C++ WebAssembly scheduler
        run: |
          bash space/build_wasm.sh
          node space/tests/smoke_wasm.js

      - name: Stage the Pages artifact
        run: |
          mkdir -p _site/demo/wasm _site/demo/data
          cp -a docs/. _site/
          python3 tools/build_pages.py --source docs --output _site
          cp space/app.js space/runtime.js _site/demo/
          cp -a space/wasm/. _site/demo/wasm/
          cp -a space/data/. _site/demo/data/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
