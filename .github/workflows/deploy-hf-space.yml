name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "space/**"
      - ".github/workflows/deploy-hf-space.yml"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths:
      - "space/**"
      - ".github/workflows/deploy-hf-space.yml"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: fptr-hugging-face-space-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate inputs and browser runtime against native C++
        run: |
          node --check space/app.js
          node --check space/runtime.js
          python3 -m unittest discover -s space/tests -p 'test_*.py'
          node space/tests/test_runtime.js

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1
          actions-cache-folder: emsdk-cache

      - name: Build real C++ scheduler for the browser
        run: bash space/build_wasm.sh

      - name: Smoke-test WebAssembly scheduler
        run: node space/tests/smoke_wasm.js

      - name: Sync live Static Space
        if: github.event_name != 'pull_request'
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: config-h/FPTR-Scheduler-Demo
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
          subdirectory: space
