name: Retire FPTR Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-hf-space.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Delete retired Static Space
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check "huggingface_hub>=1.0,<2"
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("HF_TOKEN repository secret is unavailable")

          HfApi(token=token).delete_repo(
              repo_id="config-h/FPTR-Scheduler-Demo",
              repo_type="space",
              missing_ok=True,
          )
          print("Retired config-h/FPTR-Scheduler-Demo")
          PY
